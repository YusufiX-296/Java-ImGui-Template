name: Build Android App

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Download and Extract Dobby Hook Library
      run: |
        mkdir -p app/src/main/jni/includes/Dobby
        wget https://github.com/flyskyige/Dobby/archive/refs/heads/master.zip -O dobby.zip || wget https://github.com/jmpep/Dobby/archive/refs/heads/main.zip -O dobby.zip
        unzip -q dobby.zip -d temp_dobby
        cp -r temp_dobby/*/ * app/src/main/jni/includes/Dobby/
        rm -rf dobby.zip temp_dobby

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build APK with Gradle
      run: ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
